<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Fullstack Starter: a Kotlin and Next.js template with login and access management."
    />
    <title>Fullstack Starter — Artiom Diulgher</title>
    <script src="../../theme.js"></script>
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../../assets/vendor/splide/splide.min.css" />
    <link rel="stylesheet" href="../../styles.css" />
    <script src="../../assets/vendor/splide/splide.min.js"></script>
    <script type="module" src="../../app.js"></script>
  </head>
  <body data-page="project" data-project="fullstack-starter">
    <a class="skip-link" href="#project-views">Skip to screenshots</a>
    <header class="site-header">
      <a class="identity" href="../../">
        <span class="monogram" aria-hidden="true">ad<span>.</span></span>
        <span>Artiom Diulgher</span>
      </a>
      <nav aria-label="Main navigation">
        <a href="../../">All projects</a
        ><a
          href="https://github.com/GeneralTao2"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub ↗</a
        ><button
          class="theme-toggle"
          id="theme-toggle"
          aria-label="Switch to dark theme"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3.8" />
            <path
              d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        </button>
      </nav>
    </header>
    <main class="project-layout">
      <aside class="project-info">
        <div class="project-heading">
          <h1 id="project-title">Fullstack Starter</h1>
          <ul class="technology-list" aria-label="Technologies"></ul>
        </div>
        <p class="project-description" id="project-description">
        </p>
        <div class="project-links">
          <a
            class="button"
            id="project-source"
            href="https://github.com/taonity/fullstack-starter"
            target="_blank"
            rel="noopener noreferrer"
            >Source code ↗</a
          >
          <a
            class="button"
            id="project-live"
            href="https://fullstack-starter.taonity.org/"
            target="_blank"
            rel="noopener noreferrer"
            >Live site ↗</a
          >
        </div>
        <p class="project-availability" id="project-availability"></p>
      </aside>
      <section
        class="view-section"
        id="project-views"
        aria-label="Project screenshots"
        aria-busy="true"
      >
        <p class="loading-message" role="status">Loading screenshots…</p>
        <div class="gallery-navigation splide" aria-label="Screenshot views">
          <nav
            class="scene-navigation splide__track"
            id="scene-navigation"
            aria-label="Choose a view"
          ></nav>
          <div class="view-controls">
            <button
              class="slideshow-button"
              id="toggle-autoplay"
              aria-label="Pause slideshow"
              aria-pressed="false"
            >
              Pause
            </button>
            <span id="scene-counter" aria-live="polite"></span>
            <button
              class="arrow-button"
              id="previous-scene"
              aria-label="Previous view"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m14.5 7-5 5 5 5" />
              </svg>
            </button>
            <button class="arrow-button" id="next-scene" aria-label="Next view">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m9.5 7 5 5-5 5" />
              </svg>
            </button>
          </div>
        </div>
        <p class="gallery-status" id="gallery-status" role="status" hidden></p>
      </section>
    </main>
    <dialog
      class="expanded-view"
      id="expanded-view"
      aria-label="Expanded screenshot"
    >
      <div
        class="expanded-image-region"
        tabindex="0"
        role="region"
        aria-label="Expanded screenshot"
      >
        <img id="expanded-image" alt="" draggable="false" />
      </div>
    </dialog>
  </body>
</html>
